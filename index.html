<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Маяк — Авторизация</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body {
      background: #000;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
      text-align: center;
    }
    .card {
      background: #1c1c1e;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 20px;
      padding: 24px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 12px 32px rgba(0,0,0,0.6);
    }
    h2 { margin: 0 0 10px; font-size: 20px; color: #30d158; }
    p { font-size: 14px; color: #8e8e93; margin: 0 0 18px; line-height: 1.4; }
    input {
      width: 100%;
      background: #0a0a0c;
      border: 1px solid #333;
      color: #ff9f0a;
      padding: 12px;
      border-radius: 12px;
      font-size: 13px;
      text-align: center;
      outline: none;
      margin-bottom: 14px;
    }
    .btn {
      width: 100%;
      background: #f36e21;
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:active { opacity: 0.85; }
    .status { font-size: 12px; color: #30d158; margin-top: 10px; min-height: 18px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>✓ Вход подтверждён!</h2>
    <p>Токен получен. Скопируйте его и вернитесь в трекер задач.</p>
    
    <input id="tokenInput" readonly value="Получение токена...">
    <button class="btn" id="copyBtn" onclick="copyToken()">Скопировать токен</button>
    <div class="status" id="statusMsg"></div>
  </div>

  <script>
    const hash = window.location.hash.substring(1);
    const params = new URLSearchParams(hash);
    const token = params.get('access_token');
    const input = document.getElementById('tokenInput');
    const statusMsg = document.getElementById('statusMsg');

    if (token) {
      input.value = token;

      // Пробуем скопировать в буфер автоматически
      navigator.clipboard.writeText(token).then(() => {
        statusMsg.textContent = '✓ Токен автоматически скопирован в буфер!';
      }).catch(() => {});

      // Пробуем послать в родительское окно (если это десктоп)
      try {
        const channel = new BroadcastChannel('mayak_auth_channel');
        channel.postMessage({ type: 'YANDEX_TOKEN', token: token });
      } catch(e) {}
      if (window.opener) {
        window.opener.postMessage({ type: 'YANDEX_TOKEN', token: token }, '*');
      }
    } else {
      input.value = 'Ошибка: токен не найден';
      input.style.color = '#ff453a';
    }

    function copyToken() {
      input.select();
      navigator.clipboard.writeText(input.value).then(() => {
        statusMsg.textContent = '✓ Скопировано! Переключитесь обратно в Маяк.';
      }).catch(() => {
        statusMsg.textContent = 'Выделите текст в поле и скопируйте вручную.';
      });
    }
  </script>
</body>
</html>
