<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Маяк — Авторизация</title>
  <style>
    body {
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    .box {
      background: #1c1c1e;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 24px;
      max-width: 460px;
      width: 100%;
    }
    input {
      width: 100%;
      background: #000;
      border: 1px solid #333;
      color: #30d158;
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      margin-top: 10px;
      box-sizing: border-box;
      text-align: center;
    }
    button {
      background: #f36e21;
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      margin-top: 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="box">
    <h3 id="statusText">Авторизация успешна!</h3>
    <p id="subText" style="color: #888; font-size: 14px;">Закрываем окно...</p>
    
    <div id="manualBlock" style="display: none;">
      <p style="color: #aaa; font-size: 13px;">Если окно не закрылось само, скопируйте токен и вставьте в приложении:</p>
      <input id="tokenField" readonly>
      <button onclick="copyToken()">Скопировать токен</button>
    </div>
  </div>

  <script>
    const hash = window.location.hash.substring(1);
    const params = new URLSearchParams(hash);
    const token = params.get('access_token');

    if (token) {
      document.getElementById('tokenField').value = token;

      // 1. Пытаемся отправить токен родительскому окну через BroadcastChannel (работает даже между вкладками)
      try {
        const channel = new BroadcastChannel('mayak_auth_channel');
        channel.postMessage({ type: 'YANDEX_TOKEN', token: token });
      } catch(e) {}

      // 2. Пытаемся отправить через postMessage
      if (window.opener) {
        window.opener.postMessage({ type: 'YANDEX_TOKEN', token: token }, '*');
      }

      // 3. Закрываем popup через секунду
      setTimeout(() => {
        window.close();
      }, 800);

      // Если браузер запретил закрытие окна, показываем резервную кнопку копирования
      setTimeout(() => {
        document.getElementById('subText').style.display = 'none';
        document.getElementById('manualBlock').style.display = 'block';
      }, 1200);
    } else {
      document.getElementById('statusText').textContent = 'Токен не получен';
      document.getElementById('subText').textContent = 'Попробуйте войти заново.';
    }

    function copyToken() {
      const f = document.getElementById('tokenField');
      f.select();
      navigator.clipboard.writeText(f.value);
      alert('Токен скопирован! Вставьте его в окно в приложении.');
    }
  </script>
</body>
</html>
