<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Маяк — Авторизация...</title>
  <style>
    body {
      background: #0f0f11;
      color: #f5f5f7;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #f36e21;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <h2>Авторизация успешна</h2>
  <p>Передаем данные в Маяк и закрываем окно...</p>

  <script>
    const hash = window.location.hash.substring(1);
    const params = new URLSearchParams(hash);
    const token = params.get('access_token');

    if (token) {
      // 1. Способ 1: Прямая передача в родительское окно (popup)
      if (window.opener && !window.opener.closed) {
        window.opener.postMessage({ type: 'YANDEX_AUTH_SUCCESS', token: token }, '*');
      }

      // 2. Способ 2: Широковещательный канал (если открылось новой вкладкой)
      try {
        const channel = new BroadcastChannel('mayak_auth_channel');
        channel.postMessage({ type: 'YANDEX_AUTH_SUCCESS', token: token });
      } catch (e) {}

      // Закрываем окно через полсекунды
      setTimeout(() => {
        window.close();
      }, 400);
    }
  </script>
</body>
</html>
